# One-click deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: spotify-lyrics
    runtime: node
    # Free plan: sleeps when nothing is polling it, wakes on the next visit.
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false
      # Free Postgres from https://neon.tech (doesn't expire). Paste its connection string.
      - key: DATABASE_URL
        sync: false
      # Optional: Spotify's own lyrics as a fallback (see README). Leave empty to turn off.
      - key: SPOTIFY_SP_DC
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: DISPLAY_TOKEN
        generateValue: true

